<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B1230">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sunrise">
  <title>Sunrise</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="icon" href="img/icon-192.png">
  <style>
    :root{--bg:#1B1230;--card:#2B1E47;--border:#4A3770;--orchid:#E07BFF;--gold:#FFC24B;--teal:#7FD1C7;--cream:#FFF3E3;--muted:#CDBBE0}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--cream);font-family:Nunito,system-ui,sans-serif;min-height:100%}
    .app-shell{max-width:430px;min-height:100dvh;margin:auto;position:relative;overflow:hidden;
      padding:calc(env(safe-area-inset-top) + 20px) 23px calc(env(safe-area-inset-bottom) + 32px)}
    .sky{position:absolute;inset:0 0 auto 0;height:390px;background:url(img/sunrise-header.jpg) center bottom/cover}
    .sky:after{content:'';position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(transparent,var(--bg))}
    .content{position:relative}
    .brand{font-size:22px;color:var(--gold)}
    h1{font-size:32px;font-weight:500;line-height:1.12;margin:14px 0 0}
    .card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:20px;margin-top:220px}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0}
    .check{margin:12px 0 0;font-size:17px}
    .ok{color:var(--teal)}.wait{color:var(--muted)}
    .version{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}
  </style>
</head>
<body>
  <main class="app-shell">
    <div class="sky" aria-hidden="true"></div>
    <div class="content">
      <span class="brand">sunrise ☀</span>
      <h1>Good morning,<br>Amanda Jeane</h1>
      <article class="card">
        <p class="eyebrow">Step 0 · install test</p>
        <p class="check" id="mode-check"></p>
        <p class="check" id="offline-check"></p>
      </article>
      <p class="version">Version <span id="version">0.1</span></p>
    </div>
  </main>
  <script>
    const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    document.getElementById('mode-check').innerHTML = standalone
      ? '<span class="ok">✓ Opened from your home screen</span>'
      : '<span class="wait">○ Opened in Safari. Add it to your home screen next.</span>';

    const offline = document.getElementById('offline-check');
    offline.innerHTML = '<span class="wait">○ Getting ready to work offline…</span>';
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => {
        offline.innerHTML = '<span class="ok">✓ Ready to work offline</span>';
      }).catch(() => {
        offline.innerHTML = '<span class="wait">○ Offline mode is not available here</span>';
      });
    }
  </script>
</body>
</html>
